# nginx du frontend MedConnect : sert l'application React et relaie l'API vers le backend.
# Une seule origine pour le navigateur → pas de CORS, cookie de session SameSite=Lax.

# Conserve le protocole d'origine si un autre proxy HTTPS est placé devant
map $http_x_forwarded_proto $proto_origine {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# WebSocket (Socket.io)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream medconnect_api {
    server backend:5000;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    # Même limite que l'API (fichiers de 10 Mo + marge pour le formulaire)
    client_max_body_size 12m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # ── API, fichiers médicaux, temps réel → backend ──
    location /api/ {
        proxy_pass http://medconnect_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proto_origine;
    }
    location /uploads/ {
        proxy_pass http://medconnect_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proto_origine;
    }
    location /socket.io/ {
        proxy_pass http://medconnect_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proto_origine;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
    }

    # ── Application React ──
    # Fichiers de build : nom contenant un hash → mis en cache longtemps
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    # Service worker (notifications) : jamais en cache, sinon les mises à jour ne passent pas
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    # Routes du front (/login, /dashboard/...) → index.html, jamais mis en cache
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
    }
}
